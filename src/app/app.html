<mat-toolbar class="app-toolbar">
  @if (isHandset()) {
    <button mat-icon-button (click)="sidenav.toggle()" aria-label="切换导航" class="nav-toggle-btn">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <div class="brand-container" [routerLink]="'/home'">
    <span class="app-brand-mark"><mat-icon>live_tv</mat-icon></span>
    <span class="app-title">电视直播</span>
    <span class="app-subtitle">使用文档</span>
  </div>
  <span class="spacer"></span>
  <doc-search />
  <div class="toolbar-actions">
    <a
      mat-icon-button
      href="https://github.com/mytv-android/mytv-android"
      target="_blank"
      rel="noopener"
      aria-label="GitHub 仓库"
      matTooltip="打开 GitHub 仓库"
      class="action-btn"
    >
      <mat-icon>code</mat-icon>
    </a>
    <button
      mat-icon-button
      (click)="toggleTheme()"
      aria-label="切换主题"
      [matTooltip]="isDark() ? '切换为浅色模式' : '切换为深色模式'"
      class="action-btn theme-toggle-btn"
    >
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="app-sidenav"
  >
    <nav class="nav-list" aria-label="文档导航">
      @for (group of groups(); track group.name) {
        <div class="nav-header">{{ group.name }}</div>
        @for (entry of group.entries; track entry.path) {
          <a
            class="nav-item"
            [routerLink]="entry.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            (click)="isHandset() && sidenav.close()"
          >
            <mat-icon>{{ entry.icon }}</mat-icon>
            <span class="nav-item-label">{{ entry.label }}</span>
          </a>
        }
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="app-content" (scroll)="onContentScroll($event)">
    <div class="page-row">
      <main class="page">
        <router-outlet />
      </main>
      <doc-toc />
    </div>
    <footer class="app-footer">
      <div class="footer-content">
        <p>
          电视直播（mytv-android）使用文档 ·
          <a href="https://github.com/mytv-android/mytv-android" target="_blank" rel="noopener">GitHub 仓库</a>
        </p>
      </div>
    </footer>

    @if (showScrollTop()) {
      <button
        class="scroll-top-btn"
        (click)="scrollToTop()"
        aria-label="返回顶部"
        matTooltip="返回顶部"
        type="button"
      >
        <mat-icon>keyboard_arrow_up</mat-icon>
      </button>
    }
  </mat-sidenav-content>
</mat-sidenav-container>
